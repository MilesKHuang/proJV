name: Release

# Triggered by a version tag, e.g.:
#   git tag v0.6.0 && git push origin v0.6.0
# Produces proJV-<version>-windows-x64.zip and proJV-<version>-linux-x64.tar.gz
# and attaches them to the GitHub Release for that tag.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:            # allow a manual dry run

permissions:
  contents: write               # needed to create the Release

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-latest
            artifact: linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libsdl2-dev

      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-release-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'src/**', 'external/**') }}
          restore-keys: |
            ${{ runner.os }}-release-

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPROJV_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      # Never ship a package that failed its tests.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (CPack)
        run: cpack --config build/CPackConfig.cmake -B dist

      - name: Collect package
        shell: bash
        run: |
          ls -l dist
          mkdir -p out
          cp dist/proJV-*-${{ matrix.artifact }}.* out/

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      # Needed so the curated notes file is available to the body step; without
      # a checkout this job only has the downloaded artifacts.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: ls -lR dist

      # Use the curated notes for this tag if they exist (RELEASE_NOTES_<tag>.md),
      # else fall back to a one-liner. Always writes release_body.md so the
      # action never fails on a missing path.
      - name: Pick release body
        shell: bash
        run: |
          notes="RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            echo "using $notes"
            cp "$notes" release_body.md
          else
            # Fall back to the newest notes file in the tree before giving up.
            newest=$(ls -1 RELEASE_NOTES_v*.md 2>/dev/null | sort -V | tail -1)
            if [ -n "$newest" ]; then
              echo "$notes not found - using $newest"
              cp "$newest" release_body.md
            else
              echo "no RELEASE_NOTES file found - writing a placeholder"
              printf 'Release %s\n\nSee the commit history for details.\n' "$GITHUB_REF_NAME" > release_body.md
            fi
          fi
          wc -l release_body.md

      # The runner's own `gh`, not a third-party action: the softprops action
      # started failing on this repo with nothing but a Node 20 -> 24 deprecation
      # warning in the annotations, while both package jobs and the artifact
      # download stayed green -- twice in a row, so not transient. `gh` is
      # preinstalled, needs no bundled runtime, and prints the real API error if it
      # fails. Same behaviour: update the release for this tag if it exists, else
      # create it, always with the packaged files and the curated notes.
      - name: Create / update the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(ls -A dist)" ]; then
            echo "no packaged files in dist/ -- refusing to publish a release without them"
            exit 1
          fi
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file release_body.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" \
              --notes-file release_body.md
          fi
          gh release view "$GITHUB_REF_NAME" --json tagName,assets \
            --template '{{.tagName}}: {{len .assets}} asset(s){{"\n"}}'
