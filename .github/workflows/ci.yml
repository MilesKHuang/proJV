name: CI

on:
  push:
    branches: [ main ]
    tags-ignore: [ "v*" ]        # release.yml owns tags
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false            # a Linux failure must not hide Windows
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      # Windows builds libcurl from source (external/curl-8.21.0); that is the
      # slow part of the job, so cache the build tree.
      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-build-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'src/**', 'external/**') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          # Tee the log, and on failure turn every compiler/linker error into an
          # annotation. MSBuild output is not annotated automatically, so without
          # this a Windows-only break shows up as a bare "exit code 1".
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::group::build failures"
            Select-String -Path build.log -Pattern 'error C\d+|error LNK\d+|fatal error|warning C\d+.*\[' |
              Select-Object -First 25 |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            Write-Host "::endgroup::"
            Write-Host "--- last 40 lines ---"
            Get-Content build.log -Tail 40
            exit 1
          }

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Keep the binary available for a quick manual check / future artifacts.
      - name: Upload binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: proJV_tui-windows-x64
          path: build/Release/proJV_tui.exe
          if-no-files-found: error
